name: Skills Catalog Release

# Fires on every successful revision of main (merge or direct push), NOT on tag
# pushes. It re-validates, computes the next SemVer tag deterministically, tags
# the exact commit, and creates the GitHub Release with all catalog assets in a
# single workflow (no second tag-triggered workflow -> no recursion).
#
# The App-merged update PR's push to main DOES trigger this workflow (intended).
# This workflow never pushes to main and never commits generated files, so it
# cannot recurse.

on:
  push:
    branches: [main]

permissions:
  contents: write
  # Read-only: the SemVer step looks up release:* override labels on the merged
  # PR. Without this the lookup is silently denied and overrides never apply.
  pull-requests: read

# Repository-wide lock, NOT per-SHA. Two main commits landing close together
# would otherwise both read the same "latest tag" and race to create it: one
# wins, the other either collides or computes a duplicate version. Serialized
# here, each run recomputes the next tag against the tag the previous run just
# published. Never cancel: a cancelled run can leave a tag without a release.
concurrency:
  group: skills-catalog-release
  cancel-in-progress: false

jobs:
  release:
    name: Tag + release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history + existing tags for SemVer

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.8

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      # Re-run the full suite; refuse to release non-reproducible output.
      - name: Validate
        run: |
          bun run typecheck
          bun test catalog
          bun run catalog:check

      # Reproducibility check. Must use the same plain regeneration the CI
      # catalog job asserts on main (diff base: empty), or the committed
      # diff-derived files can never match and every push to main fails here.
      - name: Regenerate (verification mode) and refuse stale output
        run: |
          bun run catalog:generate
          git add -A
          if ! git diff --cached --exit-code -- \
              catalog/generated skills-source.lock.json docs/skills; then
            echo "::error::Generated catalog is stale or non-reproducible at release time. Open a recovery PR."
            git diff --cached --stat
            exit 1
          fi

      # Separate concern: what this release actually changed, i.e. the diff
      # against the PREVIOUS RELEASE rather than against an empty base. Drives
      # the SemVer bump, the release notes, and the attached diff assets.
      - name: Rebuild the diff against the previous release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Read the latest tag AFTER the concurrency lock is held, and take it
          # from the published releases rather than `git describe`: describe
          # only sees tags reachable from HEAD and reflects the fetch made
          # before this run started queuing.
          git fetch --tags --force --quiet
          LATEST=$(gh api "/repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
                     --jq '[.[] | select(.draft==false) | .tag_name] | .[0] // ""' 2>/dev/null || echo "")
          if [ -z "$LATEST" ]; then
            LATEST=$(git tag --list 'v*' --sort=-v:refname | head -1)
          fi
          echo "latest_tag=$LATEST" >> "$GITHUB_ENV"
          echo "Latest published release: ${LATEST:-<none>}"
          if [ -n "$LATEST" ]; then
            git show "$LATEST:catalog/generated/skills-catalog.json" > /tmp/base-catalog.json 2>/dev/null || rm -f /tmp/base-catalog.json
          fi
          if [ -f /tmp/base-catalog.json ]; then
            bun run catalog:generate --base /tmp/base-catalog.json
          fi

      # Is this commit already released? Only a single, well-formed project
      # SemVer tag counts. `git tag --points-at HEAD | head -1` accepted any
      # tag (a stray `latest` would read as a release) and picked arbitrarily
      # when several existed.
      - name: Identify an existing release tag on HEAD
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t TAGS < <(git tag --points-at HEAD)
          echo "Tags on HEAD: ${TAGS[*]:-<none>}"

          if ! TAG=$(bun run catalog/src/tag-policy.ts "${TAGS[@]}" 2>/tmp/tag-policy.err); then
            echo "::error::$(cat /tmp/tag-policy.err)"
            exit 1
          fi

          if [ "$TAG" = "none" ]; then
            echo "HEAD carries no project release tag; a new release may be warranted."
            exit 0
          fi

          # A tag without a Release is a partial publish, not an idempotent
          # re-run. Fail loudly with the recovery command rather than silently
          # treating the commit as released.
          if ! gh release view "$TAG" --json tagName >/dev/null 2>&1; then
            echo "::error::Tag $TAG exists on this commit but has no GitHub Release — a previous run published the tag and then failed. Recover by publishing the release for $TAG, or delete the orphan tag with: git push origin :refs/tags/$TAG"
            exit 1
          fi

          echo "HEAD already released as $TAG; verifying its assets."
          echo "existing_tag=$TAG" >> "$GITHUB_ENV"

      - name: Compute next SemVer tag
        if: ${{ env.existing_tag == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHA=$(git rev-parse HEAD)
          # Read release-override labels from the PR that produced THIS commit.
          # The commits/pulls endpoint is an exact lookup; `gh pr list --search`
          # went through the search index, which lags behind a fresh merge and
          # silently returned nothing.
          LABELS=$(gh api "/repos/${GITHUB_REPOSITORY}/commits/${SHA}/pulls" \
                     --jq '[.[].labels[].name] | join(",")' 2>/dev/null || echo "")
          echo "Labels on the originating PR: ${LABELS:-<none>}"
          NEXT=$(bun run catalog/src/release-tag.ts "${{ env.latest_tag }}" catalog/generated/skills-catalog-diff.json "$LABELS" | tail -1)
          echo "next_tag=$NEXT" >> "$GITHUB_ENV"
          echo "Computed next tag: $NEXT"

      - name: Stop if no release is warranted
        if: ${{ env.existing_tag == '' && env.next_tag == 'none' }}
        run: echo "No catalog change to release; exiting."

      - name: Create tag + GitHub Release
        if: ${{ env.existing_tag == '' && env.next_tag != 'none' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ env.next_tag }}"
          SHA=$(git rev-parse HEAD)

          # Re-fetch tags immediately before creating, and refuse collision.
          # A collision here means another run published this version while
          # this one was computing: fail loudly rather than silently skipping,
          # which previously left the run "green" having released nothing.
          git fetch --tags --force
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::Tag $TAG already exists but does not point at $SHA. A concurrent release computed the same version. Re-run this workflow: it will recompute against the now-published tag."
            exit 1
          fi
          git tag "$TAG" "$SHA"
          git push origin "$TAG"

          # Assemble the release in a staging directory using the PUBLIC asset
          # names. The generated files live under catalog/generated/ and the
          # lock at the repository root, but the published asset names are a
          # compatibility contract — staging keeps them stable regardless of
          # where the sources sit in the tree. SHA256SUMS is computed inside the
          # staging dir so it records bare names and `sha256sum -c` works
          # against a plain `gh release download`.
          STAGE=/tmp/release-assets
          rm -rf "$STAGE" && mkdir -p "$STAGE"
          cp catalog/generated/claude_code_skills.md \
             catalog/generated/SKILLS_CATALOG.md \
             catalog/generated/skills-catalog.json \
             catalog/generated/skills-catalog-diff.json \
             catalog/generated/catalog-change-report.md \
             "$STAGE/"
          cp skills-source.lock.json "$STAGE/"
          tar -C docs -czf "$STAGE/docs-skills.tar.gz" skills

          ASSETS="claude_code_skills.md SKILLS_CATALOG.md skills-catalog.json skills-source.lock.json skills-catalog-diff.json catalog-change-report.md docs-skills.tar.gz"
          # shellcheck disable=SC2086
          ( cd "$STAGE" && sha256sum $ASSETS > SHA256SUMS )

          # Release notes: version + source revisions + change counts + checksums.
          TAG="$TAG" SHA="$SHA" bun run catalog/src/summary.ts --release-notes > /tmp/release-notes.md
          {
            echo ""
            echo "### Checksums (release assets)"
            cat "$STAGE/SHA256SUMS"
          } >> /tmp/release-notes.md
          cat /tmp/release-notes.md >> "$GITHUB_STEP_SUMMARY"

          gh release create "$TAG" \
            --target "$SHA" \
            --title "$TAG" \
            --notes-file /tmp/release-notes.md \
            "$STAGE/claude_code_skills.md" \
            "$STAGE/SKILLS_CATALOG.md" \
            "$STAGE/skills-catalog.json" \
            "$STAGE/skills-source.lock.json" \
            "$STAGE/skills-catalog-diff.json" \
            "$STAGE/catalog-change-report.md" \
            "$STAGE/SHA256SUMS" \
            "$STAGE/docs-skills.tar.gz"

      # Idempotent path: HEAD is already tagged, so this run must PROVE the
      # existing release is complete and uncorrupted rather than assume it.
      # Downloads every asset and verifies it byte-for-byte against the
      # release's own SHA256SUMS — a filename check cannot detect a truncated
      # upload, and a truncated upload is exactly what a half-finished release
      # leaves behind.
      - name: Verify existing release is complete and uncorrupted
        if: ${{ env.existing_tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ env.existing_tag }}"
          WORK=$(mktemp -d)
          echo "Verifying release $TAG"

          if ! gh release view "$TAG" --json assets --jq '.assets[].name' > "$WORK/names.txt" 2>/dev/null; then
            echo "::error::Tag $TAG exists but has no GitHub Release. Recover with: gh release create $TAG --target $(git rev-parse HEAD) --title $TAG --notes-file <notes> <assets…>  (or delete the orphan tag: git push origin :refs/tags/$TAG)"
            exit 1
          fi

          if ! grep -qx "SHA256SUMS" "$WORK/names.txt"; then
            echo "::error::Release $TAG has no SHA256SUMS asset, so its contents cannot be verified. Re-publish the release assets for $TAG."
            exit 1
          fi

          gh release download "$TAG" --dir "$WORK" --clobber
          MISSING=0
          while read -r _sum name; do
            [ -z "$name" ] && continue
            if [ ! -f "$WORK/$name" ]; then
              echo "::error::Release $TAG is PARTIAL: SHA256SUMS lists $name but it is not attached."
              MISSING=1
            fi
          done < "$WORK/SHA256SUMS"
          [ "$MISSING" -eq 0 ] || {
            echo "::error::Recover by re-uploading the missing assets: gh release upload $TAG <files…> --clobber"
            exit 1
          }

          if ! ( cd "$WORK" && sha256sum -c SHA256SUMS ); then
            echo "::error::Release $TAG is CORRUPT: at least one asset does not match its recorded SHA256. Re-upload with: gh release upload $TAG <files…> --clobber"
            exit 1
          fi

          COUNT=$(wc -l < "$WORK/SHA256SUMS" | tr -d ' ')
          echo "Release $TAG verified: $COUNT asset(s) match SHA256SUMS."
          echo "- verified \`$TAG\`: $COUNT asset(s) match SHA256SUMS" >> "$GITHUB_STEP_SUMMARY"
          rm -rf "$WORK"

      - name: Summary
        if: always()
        run: |
          {
            echo "## Skills Catalog Release"
            echo ""
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| commit | \`${GITHUB_SHA}\` |"
            echo "| previous release | \`${{ env.latest_tag || 'none' }}\` |"
            echo "| computed next tag | \`${{ env.next_tag || 'n/a' }}\` |"
            echo "| already tagged as | \`${{ env.existing_tag || 'no' }}\` |"
            if [ -n "${{ env.existing_tag }}" ]; then
              echo "| outcome | idempotent re-run — existing release verified |"
            elif [ "${{ env.next_tag }}" = "none" ]; then
              echo "| outcome | no catalog change — no release |"
            elif [ -n "${{ env.next_tag }}" ]; then
              echo "| outcome | released \`${{ env.next_tag }}\` |"
            else
              echo "| outcome | failed before tag computation |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"