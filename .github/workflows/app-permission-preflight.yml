name: App Permission Preflight

# Proves — rather than assumes — that the automation's GitHub App token can
# actually assign and remove a label on a pull request.
#
# Label endpoints are issue endpoints, which is usually read as "the App needs
# Issues: write". That is not necessarily true here: run 30195036275 created
# this repository's manual-review-required label using GITHUB_TOKEN whose
# permissions block was contents + pull-requests only, with no issues scope.
# Rather than granting a broader permission on a guess, this exercises the real
# path with the real token.
#
# Non-mutating by design: it creates an automation-owned temporary label, adds
# it to a PR you nominate, reads it back, removes it, verifies removal, and
# deletes the label again. It touches no catalog content and merges nothing.

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number to exercise the label path against."
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: app-permission-preflight
  cancel-in-progress: false

env:
  TEMP_LABEL: automation-preflight

jobs:
  preflight:
    name: Prove App label permissions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Automation token (GitHub App)
        id: app-token
        if: ${{ vars.ENABLE_SKILLS_AUTOMATION == 'true' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.AUTOMATION_APP_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}

      - name: Report that automation is disabled
        if: ${{ steps.app-token.outputs.token == '' }}
        run: |
          echo "::error::No App token minted (ENABLE_SKILLS_AUTOMATION is not 'true'). Nothing was tested."
          exit 1

      # NOTE: this workflow deliberately performs no checkout — it tests
      # permissions, not code. The `gh` CLI resolves the target repository from
      # the git remote, so without a checkout every subcommand fails with
      # "not a git repository" and the failure is indistinguishable from a
      # permission denial. Every gh subcommand therefore passes --repo.
      - name: Exercise the label path
        if: ${{ steps.app-token.outputs.token != '' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          FAIL=0
          note() { echo "$1" | tee -a "$GITHUB_STEP_SUMMARY"; }

          note "### App label permission preflight"
          note ""
          note "- app: \`${APP_SLUG}[bot]\`"
          note "- target: PR #${PR_NUMBER}"

          # Installation coverage.
          if gh api /installation/repositories --jq '.repositories[].full_name' 2>/dev/null \
              | grep -qx "$GITHUB_REPOSITORY"; then
            note "- installation covers \`$GITHUB_REPOSITORY\`: \`yes\`"
          else
            note "- installation covers \`$GITHUB_REPOSITORY\`: \`NO\`"
            FAIL=1
          fi

          # ---- Diagnostics -------------------------------------------------
          # A preflight that hides the API error is not a diagnostic. Capture
          # the HTTP status and GitHub's own X-Accepted-GitHub-Permissions
          # header, which states exactly which permission each endpoint wants.
          # Only status lines and permission names are printed — never a token.
          # Every extraction is tolerant: `set -e` would otherwise abort the
          # whole step the moment a grep found nothing, which is exactly the
          # case this function exists to report on.
          probe() {
            local label="$1"; shift
            local out status accepted msg
            out=$(gh api -i "$@" 2>&1 || true)
            status=$(printf '%s\n' "$out" | grep -m1 -oE 'HTTP/[0-9.]+ [0-9]{3}' | grep -oE '[0-9]{3}$' || true)
            if [ -z "$status" ]; then
              status=$(printf '%s\n' "$out" | grep -m1 -oE 'HTTP [0-9]{3}' | grep -oE '[0-9]{3}' || true)
            fi
            accepted=$(printf '%s\n' "$out" | grep -im1 '^x-accepted-github-permissions:' | cut -d: -f2- | tr -d '\r' | sed 's/^ *//' || true)
            msg=$(printf '%s\n' "$out" | grep -m1 -oE '"message": *"[^"]*"' | sed 's/.*: *"//;s/"$//' || true)
            note "  - \`${label}\` -> HTTP \`${status:-?}\`${msg:+ - ${msg}}${accepted:+ (endpoint accepts: \`${accepted}\`)}"
          }

          note ""
          note "**Diagnostics — exact operation, status, and required permission**"
          probe "GET  /repos/:o/:r/labels"          "/repos/${GITHUB_REPOSITORY}/labels"
          probe "POST /repos/:o/:r/labels"          -X POST "/repos/${GITHUB_REPOSITORY}/labels" -f name=preflight-probe -f color=ededed
          probe "POST /repos/:o/:r/issues/N/labels" -X POST "/repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/labels" -f "labels[]=preflight-probe"
          probe "GET  /repos/:o/:r/pulls/N"         "/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}"
          # Best effort: remove the probe label if POST unexpectedly succeeded.
          gh api -X DELETE "/repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/labels/preflight-probe" >/dev/null 2>&1 || true
          gh api -X DELETE "/repos/${GITHUB_REPOSITORY}/labels/preflight-probe" >/dev/null 2>&1 || true
          note ""

          # 1. Create the temporary label (idempotent).
          if gh label create "$TEMP_LABEL" --repo "$GITHUB_REPOSITORY" --description "Temporary; created by the App permission preflight" --color ededed 2>/dev/null; then
            note "- create label: \`ok\`"
          elif gh label list --repo "$GITHUB_REPOSITORY" --search "$TEMP_LABEL" --json name --jq '.[].name' | grep -qx "$TEMP_LABEL"; then
            note "- create label: \`already existed\`"
          else
            note "- create label: \`DENIED\`"
            FAIL=1
          fi

          # 2. Assign it to the nominated PR — the operation actually in question.
          if gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label "$TEMP_LABEL" >/dev/null 2>&1; then
            note "- assign label to PR: \`ok\`"
          else
            note "- assign label to PR: \`DENIED\`"
            FAIL=1
          fi

          # 3. Read it back. A silent no-op must not read as success.
          if [ "$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json labels --jq "[.labels[].name] | index(\"$TEMP_LABEL\") != null")" = "true" ]; then
            note "- verify assignment: \`present\`"
          else
            note "- verify assignment: \`NOT PRESENT\`"
            FAIL=1
          fi

          # 4. Clean up: remove from the PR and delete the label.
          if gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label "$TEMP_LABEL" >/dev/null 2>&1; then
            note "- remove label from PR: \`ok\`"
          else
            note "- remove label from PR: \`FAILED\`"
            FAIL=1
          fi

          if [ "$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json labels --jq "[.labels[].name] | index(\"$TEMP_LABEL\") != null")" = "false" ]; then
            note "- verify cleanup: \`removed\`"
          else
            note "- verify cleanup: \`STILL PRESENT\`"
            FAIL=1
          fi

          if gh label delete "$TEMP_LABEL" --repo "$GITHUB_REPOSITORY" --yes >/dev/null 2>&1; then
            note "- delete temporary label: \`ok\`"
          else
            note "- delete temporary label: \`left in place (harmless)\`"
          fi

          note ""
          if [ "$FAIL" -eq 0 ]; then
            note "**Result: the App's existing grant is sufficient. No permission expansion required.**"
          else
            note "**Result: FAILED — see the denied step above. Widen the App grant minimally (Pull requests: write usually covers labels; otherwise Issues: read & write) and re-run.**"
            exit 1
          fi