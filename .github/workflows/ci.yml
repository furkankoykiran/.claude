name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    name: Lint shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          # bin/cc-provider has no .sh suffix but is bash — lint it explicitly.
          shellcheck install.sh hooks/*.sh scripts/*.sh bin/cc-provider

  providers:
    name: Provider switcher tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run provider switcher tests
        run: ./scripts/test-providers.sh

  powershell:
    name: Lint PowerShell (PSScriptAnalyzer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $paths = @('./install.ps1', './bin/cc-provider.ps1', './scripts/nim-gateway.ps1')
          $results = foreach ($p in $paths) {
            Invoke-ScriptAnalyzer -Path $p -Settings ./PSScriptAnalyzerSettings.psd1
          }
          if ($results) {
            $results | Format-Table -AutoSize ScriptName, RuleName, Severity, Line, Message | Out-String | Write-Host
            Write-Error "PSScriptAnalyzer reported $($results.Count) issue(s)."
            exit 1
          }
          Write-Host "PSScriptAnalyzer: clean"

  install-smoke:
    name: Install smoke test + Chromium launch (ubuntu:24.04)
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    timeout-minutes: 25
    steps:
      # ubuntu:24.04 is bare — git must exist before actions/checkout runs.
      - name: Install git for checkout
        run: |
          apt-get update
          apt-get install -y git
      - uses: actions/checkout@v4
      - name: Install bootstrap prerequisites
        run: apt-get install -y curl unzip xz-utils ca-certificates
      # Use $GITHUB_WORKSPACE (the env var), not ${{ github.workspace }}: inside a
      # container the context expression can resolve to the runner-host path,
      # while the env var is the container mount (/__w/...). They must match the
      # path install.sh actually wrote to.
      - name: Run install.sh against the checked-out code (minimal, no git sync)
        run: |
          export CLAUDE_DIR="$GITHUB_WORKSPACE"
          export CLAUDE_BOOTSTRAP_MINIMAL=1
          export CLAUDE_BOOTSTRAP_NO_SYNC=1
          ./install.sh
      # The real regression guard: the original bug was Chromium downloading but
      # failing to launch (libatk-1.0.so.0 missing). install.sh is fail-soft, so
      # it exits 0 even if the browser broke — this step is what turns CI red if
      # the fix ever regresses.
      - name: Assert Chromium can actually launch
        run: |
          export PATH="$HOME/.bun/bin:$PATH"
          cd "$GITHUB_WORKSPACE/skills/gstack"
          bun --eval 'import { chromium } from "playwright"; const b = await chromium.launch(); await b.close(); console.log("CHROMIUM_OK");'

  catalog:
    name: Skills catalog (generate + check)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      # Third-party action pinned to a full commit SHA (oven-sh/setup-bun v2.2.0).
      # The SHA MUST match the v2.2.0 tag's commit; CI validates pin integrity.
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.8
      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Tests
        run: bun test catalog
      - name: Catalog check (parity + consistency + policy + determinism)
        run: bun run catalog:check
      # Regenerate offline from the committed lock + cache; the committed
      # generated files must already be current (main-branch invariant).
      - name: Regenerate catalog
        run: bun run catalog:generate
      - name: Fail if generated files are stale
        run: |
          git add -A
          if ! git diff --cached --exit-code -- \
              SKILLS_CATALOG.md claude_code_skills.md skills-catalog.json \
              skills-source.lock.json skills-catalog-diff.json \
              catalog-change-report.md SHA256SUMS docs/skills; then
            echo "::error::Generated catalog files are stale. Run 'bun run catalog:generate' and commit the result."
            git diff --cached --stat
            exit 1
          fi
      - name: Job summary
        if: always()
        run: |
          if [ -f skills-catalog.json ]; then
            bun run catalog/src/summary.ts >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-diagnostics-${{ github.run_id }}
          path: |
            skills-catalog.json
            skills-source.lock.json
            catalog-change-report.md
            skills-catalog-diff.json
          retention-days: 7
          if-no-files-found: ignore