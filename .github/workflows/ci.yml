name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Workflow files are supply-chain surface: a typo in an `if:` guard silently
  # disables a safety gate. actionlint parses every workflow, type-checks the
  # expression syntax, and runs shellcheck over each `run:` block.
  actionlint:
    name: Lint GitHub Actions workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run actionlint
        env:
          # Pinned release + its SHA-256. Downloading a linter and executing it
          # unverified in a repo whose other workflows handle an App private
          # key is not acceptable, so the archive is checksummed before it runs.
          #
          # To upgrade: bump both values together.
          #   V=<new-version>
          #   curl -fsSLO "https://github.com/rhysd/actionlint/releases/download/v$V/actionlint_${V}_linux_amd64.tar.gz"
          #   sha256sum "actionlint_${V}_linux_amd64.tar.gz"
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          ARCHIVE="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 -o "/tmp/${ARCHIVE}" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${ARCHIVE}"
          echo "${ACTIONLINT_SHA256}  /tmp/${ARCHIVE}" > /tmp/actionlint.sha256
          if ! sha256sum -c /tmp/actionlint.sha256; then
            echo "::error::actionlint ${ACTIONLINT_VERSION} archive failed checksum verification. Refusing to execute it."
            exit 1
          fi
          tar -C /tmp -xzf "/tmp/${ARCHIVE}" actionlint
          # ubuntu-latest ships shellcheck, which actionlint uses for run: blocks.
          /tmp/actionlint -color -verbose .github/workflows/*.yml

  shellcheck:
    name: Lint shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          # bin/cc-provider and bin/fkt have no .sh suffix but are bash — lint
          # them explicitly.
          shellcheck install.sh hooks/*.sh scripts/*.sh migrations/*.sh \
            bin/cc-provider bin/fkt

  providers:
    name: Provider switcher tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run provider switcher tests
        run: ./scripts/test-providers.sh

  # The updater is the one component that can destroy a user's work, so its
  # refusal paths are tested as first-class behaviour. Everything runs against
  # throwaway repositories and throwaway config/state dirs; the "remote" is a
  # local bare repo, so this job needs no network.
  updater:
    name: Updater (fkt) behaviour tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Run fkt tests
        run: ./scripts/test-fkt.sh

  powershell:
    name: Lint PowerShell (PSScriptAnalyzer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $paths = @('./install.ps1', './bin/cc-provider.ps1', './scripts/nim-gateway.ps1')
          $results = foreach ($p in $paths) {
            Invoke-ScriptAnalyzer -Path $p -Settings ./PSScriptAnalyzerSettings.psd1
          }
          if ($results) {
            $results | Format-Table -AutoSize ScriptName, RuleName, Severity, Line, Message | Out-String | Write-Host
            Write-Error "PSScriptAnalyzer reported $($results.Count) issue(s)."
            exit 1
          }
          Write-Host "PSScriptAnalyzer: clean"

  install-smoke:
    name: Install smoke test + Chromium launch (ubuntu:24.04)
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    timeout-minutes: 25
    steps:
      # ubuntu:24.04 is bare — git must exist before actions/checkout runs.
      - name: Install git for checkout
        run: |
          apt-get update
          apt-get install -y git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install bootstrap prerequisites
        run: apt-get install -y curl unzip xz-utils ca-certificates
      # Use $GITHUB_WORKSPACE (the env var), not ${{ github.workspace }}: inside a
      # container the context expression can resolve to the runner-host path,
      # while the env var is the container mount (/__w/...). They must match the
      # path install.sh actually wrote to.
      - name: Run install.sh against the checked-out code (minimal, no git sync)
        run: |
          export CLAUDE_DIR="$GITHUB_WORKSPACE"
          export CLAUDE_BOOTSTRAP_MINIMAL=1
          export CLAUDE_BOOTSTRAP_NO_SYNC=1
          ./install.sh
      # The real regression guard: the original bug was Chromium downloading but
      # failing to launch (libatk-1.0.so.0 missing). install.sh is fail-soft, so
      # it exits 0 even if the browser broke — this step is what turns CI red if
      # the fix ever regresses.
      - name: Assert Chromium can actually launch
        run: |
          export PATH="$HOME/.bun/bin:$PATH"
          cd "$GITHUB_WORKSPACE/skills/gstack"
          bun --eval 'import { chromium } from "playwright"; const b = await chromium.launch(); await b.close(); console.log("CHROMIUM_OK");'

  # The marketplace and every plugin are validated by Claude Code's own strict
  # validator, not by our schema guesses. It is the only thing that knows the
  # current field set, and it is what the Community Marketplace review pipeline
  # runs on submission.
  marketplace-validate:
    name: Plugin + marketplace strict validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.8
      # Pinned: the validator's rule set changes between releases, and an
      # unpinned install would turn an upstream change into a surprise red
      # build. Bumping this version IS how we adopt new validation rules.
      - name: Install the Claude Code CLI
        env:
          CLAUDE_CODE_VERSION: 2.1.220
        run: npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
      - name: Validate marketplace + every plugin (--strict)
        env:
          # Turn a missing CLI into a failure here; the script's default is to
          # skip, which is right for a developer's machine but not for CI.
          MARKETPLACE_VALIDATE_SKIP_CODE: 1
        run: bun run marketplace:validate

  catalog:
    name: Skills catalog (generate + check)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Third-party action pinned to a full commit SHA (oven-sh/setup-bun v2.2.0).
      # The SHA MUST match the v2.2.0 tag's commit; CI validates pin integrity.
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.8
      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Tests
        run: bun test catalog
      - name: Catalog check (parity + consistency + policy + determinism)
        run: bun run catalog:check
      # The marketplace manifests are generated from marketplace.toml + VERSION.
      # A stale manifest ships the wrong version to every installer, so this is
      # a hard failure rather than a regeneration.
      - name: Marketplace manifests are current
        run: bun run marketplace:check
      # Model-visible skill listing must stay inside the measured budget. See
      # docs/skill-context-economy.md for where the number comes from.
      - name: Skill listing budget
        run: bun run catalog:budget
      # Deterministic and offline: validates links, documented scripts, the
      # documented root layout, and that no doc references a moved path.
      - name: Documentation check
        run: bun run docs:check
      # Regenerate offline from the committed lock + cache; the committed
      # generated files must already be current (main-branch invariant).
      - name: Regenerate catalog
        run: bun run catalog:generate
      - name: Fail if generated files are stale
        run: |
          git add -A
          if ! git diff --cached --exit-code -- \
              catalog/generated skills-source.lock.json docs/skills; then
            echo "::error::Generated catalog files are stale. Run 'bun run catalog:generate' and commit the result."
            git diff --cached --stat
            exit 1
          fi
      - name: Job summary
        if: always()
        run: |
          if [ -f catalog/generated/skills-catalog.json ]; then
            bun run catalog/src/summary.ts >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: catalog-diagnostics-${{ github.run_id }}
          path: |
            catalog/generated/skills-catalog.json
            skills-source.lock.json
            catalog/generated/catalog-change-report.md
            catalog/generated/skills-catalog-diff.json
          retention-days: 7
          if-no-files-found: ignore